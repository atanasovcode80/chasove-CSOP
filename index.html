<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Какъв час имам - ЦСОП Леда Милева</title>
    
    <!-- Зареждане на React, ReactDOM и Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Зареждане на Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- SheetJS за експорт към Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body { font-family: 'Montserrat', 'Segoe UI', sans-serif; background-color: #f8fafc; }
        
        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        /* Скролбар */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    <!-- Зареждане на Firebase (v11 Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        window.FB_SDK = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, doc, setDoc, onSnapshot };
    </script>
</head>
<body class="text-slate-800 antialiased min-h-screen flex flex-col">
    <div id="root" class="flex flex-col flex-1 w-full h-full"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- КОНФИГУРАЦИИ И КОНСТАНТИ ---
        const DEFAULT_APP_ID = "csop-leda-mileva-prod";
        const APP_ID = typeof __app_id !== 'undefined' ? __app_id : DEFAULT_APP_ID;
        
        const fallbackFirebaseConfig = {
            apiKey: "AIzaSyDWXdHvh1AHGNHElup-3-Kukaadz8uSGWg",
            authDomain: "generator-razpisanie.firebaseapp.com",
            databaseURL: "https://generator-razpisanie-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "generator-razpisanie",
            storageBucket: "generator-razpisanie.firebasestorage.app",
            messagingSenderId: "756529315524",
            appId: "1:756529315524:web:faa5e91bdd62c2e05ed391"
        };
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : fallbackFirebaseConfig;

        const DAYS_BG = ['Понеделник', 'Вторник', 'Сряда', 'Четвъртък', 'Петък'];
        const AVAILABLE_YEARS = ['2024/2025', '2025/2026', '2026/2027', '2027/2028', '2028/2029', '2029/2030'];

        const TIMESLOTS = [
            { id: 1, label: "1-ви час", time: "08:00 - 08:35", start: 480, end: 515 },
            { id: 2, label: "2-ри час", time: "08:45 - 09:20", start: 525, end: 560 },
            { id: 3, label: "3-ти час", time: "09:30 - 10:05", start: 570, end: 605 },
            { id: 4, label: "4-ти час", time: "10:35 - 11:10", start: 635, end: 670 },
            { id: 5, label: "5-ти час", time: "11:20 - 11:55", start: 680, end: 715 },
            { id: 6, label: "6-ти час", time: "12:05 - 12:40", start: 725, end: 760 },
            { id: 7, label: "7-ми час", time: "12:50 - 13:25", start: 770, end: 805 }
        ];

        const PREDEFINED_TEACHERS = [
            "Милена Рачовска (Психолог)", "Калинка Илиева", "Галя Ненчева", "Петринка Нанова", 
            "Цветанка Брайкова", "Тони Иванов", "Цветанка Михайлова", "Огнян Йорданов", 
            "Атанас Атанасов", "Валентин Кръстев", "Гергана Ненова", "Петя Миланова", 
            "Любомира Пенева", "Катина Василева (Ерготерапия)", "Весела Стоянова (Логопед)"
        ];

        const PREDEFINED_SUBJECTS = [
            "Български език и литература", "Математика", "Човекът и природата", "Музика", 
            "Изобразително изкуство", "Физическо възпитание и спорт", "Компютърно моделиране", 
            "Технологии и предприемачество", "Родинознание", "Човекът и обществото", 
            "География и икономика", "История и цивилизации", "Биология и здравно образование", 
            "Информационни технологии", "Здравословни и безопасни условия на труд",
            "Учебна практика"
        ];

        // --- ИКОНИ ---
        const Icons = {
            Student: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-20 h-20 mb-4 text-blue-500 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>,
            Teacher: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-20 h-20 mb-4 text-emerald-500 group-hover:scale-110 transition-transform" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>,
            Back: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>,
            Settings: () => <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        };

        const getInitialAcademicInfo = () => {
            const d = new Date();
            const m = d.getMonth(); 
            const y = d.getFullYear();
            let year, term;
            if (m >= 8) { year = `${y}/${y+1}`; term = '1'; } 
            else if (m === 0) { year = `${y-1}/${y}`; term = '1'; } 
            else { year = `${y-1}/${y}`; term = '2'; }
            if (!AVAILABLE_YEARS.includes(year)) year = '2026/2027'; 
            return { year, term };
        };

        const formatTimeDisplay = (mins) => {
            const h = Math.floor(mins / 60).toString().padStart(2, '0');
            const m = (mins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        };

        const TeacherAvatar = ({ teacher, sizeClass = "w-12 h-12" }) => {
            const [hasError, setHasError] = useState(false);
            
            useEffect(() => { setHasError(false); }, [teacher]);

            if (!teacher || hasError) {
                return (
                    <div className={`${sizeClass} rounded-full bg-slate-200 flex items-center justify-center text-slate-400 shrink-0 border-2 border-white shadow-sm [&>svg]:w-1/2 [&>svg]:h-1/2 [&>svg]:mr-0`}>
                        <Icons.User />
                    </div>
                );
            }
            
            // Ако учителят има зададен файл за снимка, използваме него, иначе id.jpg
            const photoFile = teacher.photo ? teacher.photo : `${teacher.id}.jpg`;

            return (
                <img
                    src={`photos/${photoFile}`}
                    alt="Учител"
                    className={`${sizeClass} rounded-full object-cover object-center border-2 border-white shadow-md shrink-0 bg-slate-100`}
                    onError={() => setHasError(true)}
                />
            );
        };

        function App() {
            const initInfo = getInitialAcademicInfo();
            const [isReady, setIsReady] = useState(false);
            const [user, setUser] = useState(null);
            const [data, setData] = useState({ yearlyData: {} });
            
            const [view, setView] = useState('home'); // home, select_student, select_teacher, dashboard, admin_login, admin_panel
            const [publicUserType, setPublicUserType] = useState(''); // student / teacher
            const [publicSelectedId, setPublicSelectedId] = useState(''); // className / teacherId
            const [scheduleViewMode, setScheduleViewMode] = useState('daily');
            
            const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(false);
            const [adminPinInput, setAdminPinInput] = useState('');
            const [adminLoginError, setAdminLoginError] = useState('');

            const [systemModal, setSystemModal] = useState({ isOpen: false, title: '', message: '', type: 'info', onConfirm: null });
            const [toastMessage, setToastMessage] = useState('');

            const [currentTime, setCurrentTime] = useState(new Date());

            // Часовник
            useEffect(() => {
                const timer = setInterval(() => setCurrentTime(new Date()), 1000);
                return () => clearInterval(timer);
            }, []);

            // Firebase Initialization
            useEffect(() => {
                const initFirebase = async () => {
                    if (!window.FB_SDK) return setTimeout(initFirebase, 100);
                    try {
                        const app = window.FB_SDK.initializeApp(firebaseConfig);
                        const auth = window.FB_SDK.getAuth(app);
                        const db = window.FB_SDK.getFirestore(app);
                        
                        if (typeof __initial_auth_token !== 'undefined') {
                            await window.FB_SDK.signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await window.FB_SDK.signInAnonymously(auth);
                        }
                        
                        window.FB_SDK.onAuthStateChanged(auth, (u) => {
                            if (u) {
                                setUser(u);
                                const docRef = window.FB_SDK.doc(db, 'artifacts', APP_ID, 'public', 'data', 'school', 'master');
                                window.FB_SDK.onSnapshot(docRef, (snap) => {
                                    if (snap.exists()) {
                                        const dbData = snap.data();
                                        let updatedYearlyData = dbData.yearlyData || {};
                                        
                                        // Създаване на празна година, ако липсва
                                        if (!updatedYearlyData[initInfo.year]) {
                                            updatedYearlyData[initInfo.year] = {
                                                classes: [], teachers: [], subjects: [], conditions: [],
                                                curriculum: { '1': {}, '2': {} }, schedules: { '1': {}, '2': {} }
                                            };
                                        }

                                        let needsSave = false;
                                        // Зареждане на предефинирани учители само веднъж
                                        if (!dbData.predefinedAdded_v5) {
                                            const cy = initInfo.year;
                                            PREDEFINED_TEACHERS.forEach((pt, i) => {
                                                if (!updatedYearlyData[cy].teachers.some(t => t.name === pt)) {
                                                    updatedYearlyData[cy].teachers.push({ id: `t_pre_${i}`, name: pt });
                                                    needsSave = true;
                                                }
                                            });
                                            PREDEFINED_SUBJECTS.forEach(ps => {
                                                if (!updatedYearlyData[cy].subjects.includes(ps)) {
                                                    updatedYearlyData[cy].subjects.push(ps);
                                                    needsSave = true;
                                                }
                                            });
                                        }

                                        if (needsSave && window.FB_SDK) {
                                            const appSave = window.FB_SDK.initializeApp(firebaseConfig);
                                            const dbSave = window.FB_SDK.getFirestore(appSave);
                                            window.FB_SDK.setDoc(window.FB_SDK.doc(dbSave, 'artifacts', APP_ID, 'public', 'data', 'school', 'master'), { ...dbData, yearlyData: updatedYearlyData, predefinedAdded_v5: true }, { merge: true });
                                            return; 
                                        }
                                        setData({ yearlyData: updatedYearlyData });
                                    } else {
                                        // Инициализация на празна база
                                        setData({ yearlyData: { [initInfo.year]: { classes: [], teachers: [], subjects: [], conditions: [], curriculum: { '1': {}, '2': {} }, schedules: { '1': {}, '2': {} } } } });
                                    }
                                    setIsReady(true);
                                }, (error) => {
                                    console.error("DB Sync Error", error);
                                    setIsReady(true);
                                });
                            }
                        });
                    } catch (error) { console.error("Firebase Init Error", error); }
                };
                initFirebase();
            }, []);

            // Auto-logout за Админ панела
            useEffect(() => {
                let inactivityTimeout;
                const logout = () => {
                    if(isAdminLoggedIn) {
                        setIsAdminLoggedIn(false);
                        setAdminPinInput('');
                        setView('home');
                        setSystemModal({ isOpen: true, type: 'info', title: 'Сесията изтече', message: 'Бяхте отписани от Админ панела автоматично поради 60 минути липса на активност.', onConfirm: null });
                    }
                };
                const resetTimer = () => {
                    clearTimeout(inactivityTimeout);
                    inactivityTimeout = setTimeout(logout, 3600000); 
                };

                if (isAdminLoggedIn) {
                    resetTimer();
                    window.addEventListener('mousemove', resetTimer);
                    window.addEventListener('keydown', resetTimer);
                    window.addEventListener('click', resetTimer);
                    window.addEventListener('scroll', resetTimer);
                }
                return () => {
                    clearTimeout(inactivityTimeout);
                    window.removeEventListener('mousemove', resetTimer);
                    window.removeEventListener('keydown', resetTimer);
                    window.removeEventListener('click', resetTimer);
                    window.removeEventListener('scroll', resetTimer);
                };
            }, [isAdminLoggedIn]);

            const saveData = async (updatedData) => {
                if (!user || !window.FB_SDK) return;
                try {
                    const app = window.FB_SDK.initializeApp(firebaseConfig);
                    const db = window.FB_SDK.getFirestore(app);
                    await window.FB_SDK.setDoc(window.FB_SDK.doc(db, 'artifacts', APP_ID, 'public', 'data', 'school', 'master'), updatedData, { merge: true });
                    setData(updatedData);
                } catch (error) { showToast("Грешка при запазване в облака!"); }
            };

            const showToast = (msg) => { setToastMessage(msg); setTimeout(() => setToastMessage(''), 3000); };

            const handleAdminLogin = (e) => {
                e.preventDefault();
                if (adminPinInput === '1500510') { 
                    setIsAdminLoggedIn(true); 
                    setAdminLoginError(''); 
                    setView('admin_panel');
                } else { 
                    setAdminLoginError("Грешна парола!"); 
                    setAdminPinInput(''); 
                }
            };

            const renderPublicHome = () => (
                <div className="flex flex-col items-center justify-center min-h-[75vh] px-4 fade-in mt-10 w-full max-w-4xl mx-auto">
                    <h1 className="text-3xl md:text-5xl font-extrabold text-slate-800 text-center mb-4 tracking-tight">Провери какви часове имаш</h1>
                    <p className="text-slate-500 mb-10 text-lg md:text-xl text-center font-medium">Избери своя профил, за да видиш дневното си разписание.</p>
                    
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                        <button onClick={() => { setView('select_student'); setPublicSelectedId(''); }} className="flex flex-col items-center justify-center p-8 bg-white rounded-[2rem] shadow-md border-4 border-transparent hover:border-blue-200 hover:shadow-xl hover:-translate-y-1 transition-all group md:h-64">
                            <Icons.Student />
                            <span className="text-3xl md:text-4xl font-extrabold text-slate-700 group-hover:text-blue-600 transition-colors">Ученици</span>
                        </button>
                        <button onClick={() => { setView('select_teacher'); setPublicSelectedId(''); }} className="flex flex-col items-center justify-center p-8 bg-white rounded-[2rem] shadow-md border-4 border-transparent hover:border-emerald-200 hover:shadow-xl hover:-translate-y-1 transition-all group md:h-64">
                            <Icons.Teacher />
                            <span className="text-3xl md:text-4xl font-extrabold text-slate-700 group-hover:text-emerald-600 transition-colors">Персонал</span>
                        </button>
                    </div>
                </div>
            );

            const renderPublicSelector = () => {
                const isStudent = view === 'select_student';
                const currentYearData = data.yearlyData[initInfo.year] || { classes: [], teachers: [] };
                
                const options = isStudent 
                    ? currentYearData.classes.map(p => ({ value: p, label: p }))
                    : currentYearData.teachers.map(t => ({ value: t.id, label: t.name }));

                return (
                    <div className="flex flex-col items-center pt-20 px-4 fade-in w-full max-w-2xl mx-auto">
                        <button onClick={() => setView('home')} className="self-start flex items-center text-slate-500 hover:text-slate-800 mb-8 text-lg font-bold transition-colors">
                            <Icons.Back /> Назад към началото
                        </button>
                        <div className="bg-white p-8 md:p-10 rounded-[2rem] shadow-xl border border-slate-100 w-full">
                            <h2 className="text-3xl md:text-4xl font-extrabold text-slate-800 mb-8 text-center">{isStudent ? "Аз съм ученик от..." : "Аз съм..."}</h2>
                            <select className="w-full text-xl md:text-2xl p-4 md:p-6 bg-slate-50 border-4 border-slate-200 rounded-xl mb-8 focus:outline-none focus:border-blue-500 transition-all font-bold text-slate-700 cursor-pointer shadow-inner"
                                value={publicSelectedId} onChange={(e) => setPublicSelectedId(e.target.value)}>
                                <option value="" disabled>-- Избери от списъка --</option>
                                {options.map(opt => <option key={opt.value} value={opt.value}>{opt.label}</option>)}
                            </select>
                            <button disabled={!publicSelectedId} onClick={() => { setPublicUserType(isStudent ? 'student' : 'teacher'); setView('dashboard'); }}
                                className={`w-full p-4 md:p-6 rounded-xl text-2xl font-black transition-all shadow-md flex items-center justify-center ${publicSelectedId ? 'bg-blue-600 text-white hover:bg-blue-700 hover:shadow-xl transform hover:-translate-y-1' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}`}>
                                Продължи
                            </button>
                        </div>
                    </div>
                );
            };

            const renderPublicDashboard = () => {
                const currentYearData = data.yearlyData[initInfo.year] || {};
                const currentSchedules = currentYearData.schedules?.[initInfo.term] || {};
                const currentTeachers = currentYearData.teachers || [];
                
                let displayName = publicSelectedId;
                if (publicUserType === 'teacher') {
                    const t = currentTeachers.find(x => x.id === publicSelectedId);
                    displayName = t ? t.name : publicSelectedId;
                }
                
                // Определяне на деня
                let dayOfWeek = currentTime.getDay();
                let currentMins = currentTime.getHours() * 60 + currentTime.getMinutes();
                const isWeekend = dayOfWeek === 0 || dayOfWeek === 6;
                const todayIndex = isWeekend ? 0 : dayOfWeek - 1; // 0=Mon, 4=Fri
                const todayStr = isWeekend ? "Понеделник" : DAYS_BG[todayIndex];

                // Изграждане на дневната програма
                let todaySchedule = {}; 
                let weekSched = { 0:{}, 1:{}, 2:{}, 3:{}, 4:{} };

                if (publicUserType === 'student') {
                    todaySchedule = currentSchedules[publicSelectedId]?.[todayIndex] || {};
                    weekSched = currentSchedules[publicSelectedId] || weekSched;
                } else {
                    // За учител: претърсваме всички класове за съответния ден
                    Object.keys(currentSchedules).forEach(cls => {
                        [0,1,2,3,4].forEach(d => {
                            const dayData = currentSchedules[cls][d];
                            if (dayData) {
                                Object.keys(dayData).forEach(hour => {
                                    if (dayData[hour] && dayData[hour].tId === publicSelectedId) {
                                        if (d === todayIndex) {
                                            todaySchedule[hour] = { sub: dayData[hour].sub, isWith: cls };
                                        }
                                        weekSched[d][hour] = { sub: dayData[hour].sub, isWith: cls };
                                    }
                                });
                            }
                        });
                    });
                }

                // Статус
                let statusType = 'no_data';
                let currentSlot = null, nextSlot = null;

                const activeHours = Object.keys(todaySchedule).map(Number).sort((a,b)=>a-b);
                
                if (isWeekend) statusType = 'weekend';
                else if (activeHours.length > 0) {
                    for(let h of activeHours) {
                        const slotDef = TIMESLOTS.find(s => s.id === h);
                        if(slotDef) {
                            if (currentMins >= slotDef.start && currentMins <= slotDef.end) {
                                currentSlot = slotDef;
                                break;
                            }
                            if (currentMins < slotDef.start && !nextSlot) {
                                nextSlot = slotDef;
                            }
                        }
                    }
                    if (currentSlot) statusType = 'in_class';
                    else if (nextSlot && currentMins < TIMESLOTS.find(s=>s.id === activeHours[0])?.start) statusType = 'before_school';
                    else if (!currentSlot && !nextSlot) statusType = 'after_school';
                    else statusType = 'break';
                }

                return (
                    <div className="max-w-6xl mx-auto pt-8 px-4 pb-20 fade-in w-full flex flex-col flex-1">
                        <div className="flex flex-col md:flex-row md:items-center justify-between mb-8 bg-white p-5 md:p-6 rounded-[2rem] shadow-sm border border-slate-100">
                            <button onClick={() => { setView('home'); setScheduleViewMode('daily'); }} className="flex items-center justify-center p-3 bg-slate-100 rounded-full shadow-inner text-slate-600 hover:text-blue-600 hover:bg-blue-50 transition-all self-start md:self-auto mb-4 md:mb-0 w-12 h-12 shrink-0">
                                <Icons.Back />
                            </button>
                            <div className="text-left md:text-right w-full md:pl-6">
                                <div className="text-sm text-slate-400 font-bold uppercase tracking-widest mb-1">Профил</div>
                                <div className="text-3xl md:text-4xl font-black text-slate-800 tracking-tight leading-tight mb-4">{displayName}</div>
                                
                                <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between md:justify-end gap-4 w-full">
                                    <div className="flex bg-slate-100 p-1.5 rounded-2xl w-full sm:w-auto shadow-inner">
                                        <button onClick={() => setScheduleViewMode('daily')} className={`flex-1 sm:flex-none px-6 py-2 rounded-xl font-black text-sm md:text-lg transition-all ${scheduleViewMode === 'daily' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>Днес</button>
                                        <button onClick={() => setScheduleViewMode('weekly')} className={`flex-1 sm:flex-none px-6 py-2 rounded-xl font-black text-sm md:text-lg transition-all ${scheduleViewMode === 'weekly' ? 'bg-white shadow-sm text-blue-600' : 'text-slate-500 hover:text-slate-700'}`}>Седмица</button>
                                    </div>
                                    <div className="text-lg font-bold text-indigo-600 whitespace-nowrap">{todayStr}</div>
                                </div>
                            </div>
                        </div>

                        {scheduleViewMode === 'daily' ? (
                            <>
                                {/* STATUS BOX */}
                                {statusType === 'weekend' && <div className="bg-emerald-100 text-emerald-800 p-6 rounded-[1.5rem] text-center text-2xl font-extrabold mb-8">Днес е почивен ден! Приятна почивка!</div>}
                                {statusType === 'no_data' && <div className="bg-slate-200 text-slate-600 p-6 rounded-[1.5rem] text-center text-2xl font-extrabold mb-8">Няма въведени часове за днес.</div>}
                                {statusType === 'after_school' && <div className="bg-blue-100 text-blue-800 p-6 rounded-[1.5rem] text-center text-2xl font-extrabold mb-8">Учебните часове за днес приключиха!</div>}
                                
                                {statusType === 'before_school' && nextSlot && (
                                    <div className="bg-blue-50 text-blue-800 p-6 rounded-[1.5rem] shadow-sm border-l-8 border-blue-400 mb-8">
                                        <h3 className="text-3xl font-extrabold mb-3">Добро утро!</h3>
                                        <p className="text-xl font-medium">Първият ти час е <span className="font-black bg-white px-2 py-1 rounded-md shadow-sm mx-1 text-blue-900">{todaySchedule[nextSlot.id].sub}</span> и започва в <span className="font-black text-blue-900">{formatTimeDisplay(nextSlot.start)}</span>.</p>
                                    </div>
                                )}

                                {statusType === 'in_class' && currentSlot && (
                                    <div className="bg-orange-50 border-l-8 border-orange-500 p-6 md:p-8 rounded-[1.5rem] shadow-md mb-8 relative">
                                        <h3 className="text-2xl md:text-3xl font-extrabold text-orange-900 mb-2">В момента {publicUserType === 'student' ? 'имаш' : 'имате'}</h3>
                                        <div className="text-3xl md:text-4xl font-black text-orange-600 mb-4">{todaySchedule[currentSlot.id].sub}</div>
                                        
                                        {todaySchedule[currentSlot.id].tId && publicUserType === 'student' && (
                                            <div className="flex items-center bg-white p-3 rounded-2xl w-max border border-orange-100 mt-2">
                                                <TeacherAvatar teacher={currentTeachers.find(t => t.id === todaySchedule[currentSlot.id].tId)} sizeClass="w-12 h-12 mr-3" />
                                                <span className="text-xl font-bold text-orange-800">при {currentTeachers.find(t => t.id === todaySchedule[currentSlot.id].tId)?.name}</span>
                                            </div>
                                        )}
                                        {publicUserType === 'teacher' && (
                                            <div className="flex items-center bg-white p-3 rounded-2xl w-max border border-orange-100 mt-2">
                                                <span className="text-xl font-bold text-orange-800">с {todaySchedule[currentSlot.id].isWith} клас</span>
                                            </div>
                                        )}
                                    </div>
                                )}

                                {statusType === 'break' && nextSlot && (
                                    <div className="bg-emerald-50 border-l-8 border-emerald-500 p-6 md:p-8 rounded-[1.5rem] shadow-md mb-8 relative">
                                        <h3 className="text-3xl font-extrabold text-emerald-900 mb-4">Междучасие!</h3>
                                        <div className="text-emerald-800 text-xl font-medium mb-2">Следващият час е:</div>
                                        <div className="font-black text-3xl text-emerald-900 mb-2">{todaySchedule[nextSlot.id].sub}</div>
                                        <p className="text-emerald-900 text-xl font-black bg-emerald-200 inline-flex items-center px-4 py-2 rounded-lg mt-2">Започва след {nextSlot.start - currentMins} минути</p>
                                    </div>
                                )}

                                {/* LIST */}
                                {activeHours.length > 0 && !isWeekend && (
                                    <div className="mt-6 flex-1 max-w-4xl mx-auto w-full">
                                        <h4 className="text-2xl font-black text-slate-700 mb-6 uppercase tracking-widest border-b-4 border-slate-200 pb-2">График за деня</h4>
                                        <div className="space-y-4">
                                            {TIMESLOTS.map(slot => {
                                                const s = todaySchedule[slot.id];
                                                if(!s) return null;
                                                
                                                const isPast = currentMins > slot.end;
                                                const isCurrent = currentSlot && currentSlot.id === slot.id;

                                                return (
                                                    <div key={slot.id} className={`flex flex-col lg:flex-row lg:items-center p-5 rounded-[1.5rem] border ${isPast ? 'bg-slate-200 opacity-60 grayscale' : isCurrent ? 'bg-white shadow-xl ring-4 ring-blue-500' : 'bg-white shadow-sm border-slate-100'}`}>
                                                        <div className="flex flex-col lg:w-1/4 mb-3 lg:mb-0">
                                                            <span className={`inline-block px-3 py-1 rounded-lg font-bold w-max mb-2 ${isCurrent ? 'bg-blue-600 text-white' : 'bg-slate-100 text-slate-700'}`}>{slot.label}</span>
                                                            <span className="text-sm font-bold text-slate-500">{slot.time}</span>
                                                        </div>
                                                        <div className="lg:flex-1 lg:px-6">
                                                            <h5 className={`text-2xl font-black ${isCurrent ? 'text-blue-900' : 'text-slate-800'}`}>{s.sub}</h5>
                                                        </div>
                                                        <div className="lg:w-[40%] flex items-center lg:justify-end mt-3 lg:mt-0">
                                                            {publicUserType === 'student' && s.tId && (
                                                                <div className="flex items-center text-lg font-bold text-slate-600 bg-slate-50 px-4 py-2 rounded-xl w-full lg:w-auto">
                                                                    <TeacherAvatar teacher={currentTeachers.find(t=>t.id === s.tId)} sizeClass="w-10 h-10 mr-3" />
                                                                    <span>{currentTeachers.find(t=>t.id === s.tId)?.name}</span>
                                                                </div>
                                                            )}
                                                            {publicUserType === 'teacher' && (
                                                                <div className="flex items-center text-lg font-bold text-slate-600 bg-slate-50 px-4 py-2 rounded-xl w-full lg:w-auto">
                                                                    <span>с {s.isWith}</span>
                                                                </div>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                )}
                            </>
                        ) : (
                            <div className="mt-4 flex-1 animate-[fadeIn_0.3s_ease-out] w-full">
                                {/* Desktop Weekly Table */}
                                <div className="hidden lg:block overflow-x-auto pb-6">
                                    <table className="w-full text-left border-separate border-spacing-y-3 border-spacing-x-2">
                                        <thead>
                                            <tr>
                                                <th className="p-3 font-bold text-slate-400 uppercase tracking-widest w-28 text-center">Час</th>
                                                {DAYS_BG.map((day, idx) => (
                                                    <th key={day} className={`p-4 font-black text-xl capitalize text-center rounded-2xl transition-colors ${idx === todayIndex && !isWeekend ? 'bg-blue-600 text-white shadow-md' : 'bg-white text-slate-700 shadow-sm border border-slate-100'}`}>
                                                        {day}
                                                        {idx === todayIndex && !isWeekend && <div className="text-xs font-bold text-blue-200 uppercase mt-1">Днес</div>}
                                                    </th>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {TIMESLOTS.map(slot => (
                                                <tr key={slot.id}>
                                                    <td className="p-3 align-middle text-center bg-white rounded-2xl shadow-sm border border-slate-100">
                                                        <div className="font-black text-lg text-slate-700">{slot.label}</div>
                                                        <div className="text-[11px] font-bold text-slate-400 mt-1 whitespace-nowrap">{slot.time}</div>
                                                    </td>
                                                    {[0,1,2,3,4].map(dayIdx => {
                                                        const classData = weekSched[dayIdx]?.[slot.id];
                                                        const isToday = dayIdx === todayIndex && !isWeekend;
                                                        const isPast = isToday && currentMins > slot.end;
                                                        const isCurrent = isToday && currentMins >= slot.start && currentMins <= slot.end;

                                                        return (
                                                            <td key={dayIdx} className={`p-4 align-top rounded-2xl transition-all border ${
                                                                !classData ? 'bg-transparent border-transparent' : 
                                                                isCurrent ? 'bg-blue-50 shadow-md border-blue-200 ring-2 ring-blue-400 transform scale-[1.02] z-10' : 
                                                                isPast ? 'bg-slate-100 border-slate-200 opacity-60 grayscale' : 
                                                                'bg-white shadow-sm border-slate-100 hover:shadow-md'
                                                            }`}>
                                                                {classData ? (
                                                                    <div className="flex flex-col h-full min-h-[5rem]">
                                                                        <div className={`font-black text-lg leading-tight mb-3 ${isCurrent ? 'text-blue-900' : 'text-slate-800'}`}>
                                                                            {classData.sub}
                                                                        </div>
                                                                        <div className="mt-auto flex items-center pt-2">
                                                                            {publicUserType === 'student' && classData.tId ? (
                                                                                <TeacherAvatar teacher={currentTeachers.find(t=>t.id === classData.tId)} sizeClass="w-8 h-8 mr-2 border-2" />
                                                                            ) : (
                                                                                <div className="w-8 h-8 rounded-full bg-slate-200 flex items-center justify-center text-slate-400 shrink-0 border-2 border-white shadow-sm mr-2"><Icons.User /></div>
                                                                            )}
                                                                            <span className={`text-xs font-bold leading-tight ${isCurrent ? 'text-blue-700' : 'text-slate-500'}`}>
                                                                                {publicUserType === 'student' ? currentTeachers.find(t=>t.id === classData.tId)?.name : `с ${classData.isWith}`}
                                                                            </span>
                                                                        </div>
                                                                    </div>
                                                                ) : (
                                                                    <div className="flex items-center justify-center h-full opacity-30">
                                                                        <span className="w-2 h-2 rounded-full bg-slate-300"></span>
                                                                    </div>
                                                                )}
                                                            </td>
                                                        );
                                                    })}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>

                                {/* Mobile Weekly List */}
                                <div className="lg:hidden space-y-8 pb-8">
                                    {[0,1,2,3,4].map(dayIdx => {
                                        const hasClasses = TIMESLOTS.some(s => weekSched[dayIdx]?.[s.id]);
                                        if(!hasClasses) return null;
                                        const isToday = dayIdx === todayIndex && !isWeekend;

                                        return (
                                            <div key={dayIdx} className={`p-5 rounded-[2rem] shadow-sm border ${isToday ? 'bg-blue-50/50 border-blue-200' : 'bg-white border-slate-100'}`}>
                                                <div className="flex items-center justify-between border-b-2 border-slate-100/80 pb-3 mb-4">
                                                    <h3 className={`text-2xl font-black capitalize ${isToday ? 'text-blue-700' : 'text-slate-700'}`}>
                                                        {DAYS_BG[dayIdx]}
                                                    </h3>
                                                    {isToday && <span className="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded-lg uppercase tracking-wider shadow-sm">Днес</span>}
                                                </div>
                                                <div className="space-y-3">
                                                    {TIMESLOTS.map(slot => {
                                                        const classData = weekSched[dayIdx]?.[slot.id];
                                                        if(!classData) return null;
                                                        const isPast = isToday && currentMins > slot.end;
                                                        const isCurrent = isToday && currentMins >= slot.start && currentMins <= slot.end;

                                                        return (
                                                            <div key={slot.id} className={`flex items-center p-3 rounded-2xl ${isPast ? 'opacity-60 bg-slate-100 grayscale' : isCurrent ? 'bg-white shadow-md ring-2 ring-blue-400' : 'bg-slate-50'}`}>
                                                                <div className="w-16 text-center shrink-0 border-r-2 border-slate-200 pr-2 mr-3">
                                                                    <div className={`text-sm font-black ${isCurrent ? 'text-blue-600' : 'text-slate-600'}`}>{slot.label}</div>
                                                                </div>
                                                                <div className="flex-1">
                                                                    <div className={`text-lg font-black leading-tight ${isCurrent ? 'text-blue-900' : 'text-slate-800'}`}>{classData.sub}</div>
                                                                    <div className={`flex items-center mt-1 ${isCurrent ? 'text-blue-700' : 'text-slate-500'}`}>
                                                                        {publicUserType === 'student' && classData.tId ? (
                                                                            <TeacherAvatar teacher={currentTeachers.find(t=>t.id === classData.tId)} sizeClass="w-6 h-6 mr-1 border" />
                                                                        ) : null}
                                                                        <span className="text-sm font-bold">{publicUserType === 'student' ? currentTeachers.find(t=>t.id === classData.tId)?.name : `с ${classData.isWith}`}</span>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                );
            };

            const renderAdminLogin = () => (
                <div className="h-screen flex items-center justify-center bg-slate-900 px-4 fade-in w-full absolute inset-0 z-50">
                    <div className="bg-white p-8 md:p-12 rounded-3xl shadow-2xl max-w-md w-full border-t-8 border-indigo-600 text-center relative overflow-hidden">
                        <button onClick={() => setView('home')} className="absolute top-4 left-4 text-slate-400 hover:text-slate-700"><Icons.Back /></button>
                        <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center text-4xl text-white font-black shadow-lg mx-auto mb-6 relative z-10">🏫</div>
                        <h2 className="text-2xl font-black text-slate-800 uppercase tracking-tight mb-2">ЦСОП "Леда Милева"</h2>
                        <p className="text-sm font-bold text-slate-500 uppercase tracking-widest mb-8">Генератор на Разписания</p>
                        <form onSubmit={handleAdminLogin}>
                            <div className="mb-6 text-left">
                                <label className="text-xs font-bold text-slate-500 uppercase mb-2 block ml-1">Парола за достъп</label>
                                <input 
                                    type="password" value={adminPinInput} onChange={e => {setAdminPinInput(e.target.value); setAdminLoginError('');}} 
                                    className={`w-full p-4 bg-slate-50 border ${adminLoginError ? 'border-red-400' : 'border-slate-200'} rounded-xl font-bold text-center tracking-widest outline-none focus:border-indigo-500 focus:bg-white transition-all`}
                                    placeholder="•••••••" autoFocus
                                />
                                {adminLoginError && <p className="text-[10px] font-bold text-red-500 uppercase mt-2 text-center">{adminLoginError}</p>}
                            </div>
                            <button type="submit" className="w-full bg-indigo-600 text-white p-4 rounded-xl font-black uppercase text-sm shadow-md hover:bg-indigo-700 hover:shadow-lg transition-all">Вход в системата</button>
                        </form>
                    </div>
                </div>
            );

            const renderAdminPanel = () => {
                return <AdminPanel 
                            data={data} 
                            saveData={saveData} 
                            setSystemModal={setSystemModal} 
                            showToast={showToast} 
                            initInfo={initInfo} 
                            onExit={() => { setIsAdminLoggedIn(false); setView('home'); }} 
                        />;
            };

            // Loading state
            if (!isReady) {
                return (
                    <div className="h-screen flex flex-col items-center justify-center bg-slate-50">
                        <div className="w-16 h-16 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <p className="font-bold text-slate-600 uppercase tracking-widest text-sm">Зареждане на базата данни...</p>
                    </div>
                );
            }

            return (
                <div className="relative flex flex-col min-h-screen">
                    {/* TOASTS & MODALS (Global) */}
                    {toastMessage && (
                        <div className="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-6 py-3 rounded-full shadow-2xl z-[100] font-bold transition-all border border-slate-700 flex items-center gap-3">
                            <span className="text-emerald-400">✓</span> {toastMessage}
                        </div>
                    )}
                    {systemModal.isOpen && (
                        <div className="fixed inset-0 z-[200] flex items-center justify-center bg-slate-900/60 backdrop-blur-sm px-4">
                            <div className="bg-white p-8 rounded-3xl shadow-2xl max-w-sm w-full text-center">
                                <div className={`w-16 h-16 mx-auto rounded-full flex items-center justify-center text-2xl mb-4 ${systemModal.type === 'error' ? 'bg-red-100 text-red-600' : systemModal.type === 'confirm' ? 'bg-amber-100 text-amber-600' : 'bg-indigo-100 text-indigo-600'}`}>
                                    {systemModal.type === 'error' ? '❌' : systemModal.type === 'confirm' ? '❓' : 'ℹ️'}
                                </div>
                                <h3 className="text-xl font-black text-slate-800 mb-2">{systemModal.title}</h3>
                                <p className="text-slate-500 font-medium mb-6 text-sm whitespace-pre-line">{systemModal.message}</p>
                                
                                {systemModal.type === 'confirm' ? (
                                    <div className="flex gap-3">
                                        <button onClick={() => { if(systemModal.onConfirm) systemModal.onConfirm(); setSystemModal({isOpen: false}); }} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold uppercase text-sm hover:bg-indigo-700">Да, продължи</button>
                                        <button onClick={() => setSystemModal({isOpen: false})} className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold uppercase text-sm hover:bg-slate-300">Отказ</button>
                                    </div>
                                ) : (
                                    <button onClick={() => setSystemModal({isOpen: false})} className="bg-indigo-600 text-white px-8 py-3 rounded-xl font-bold uppercase text-sm w-full">Разбрах</button>
                                )}
                            </div>
                        </div>
                    )}

                    {view === 'home' && renderPublicHome()}
                    {(view === 'select_student' || view === 'select_teacher') && renderPublicSelector()}
                    {view === 'dashboard' && renderPublicDashboard()}
                    {view === 'admin_login' && renderAdminLogin()}
                    {view === 'admin_panel' && isAdminLoggedIn && renderAdminPanel()}

                    {/* Footer - Public View */}
                    {(view === 'home' || view === 'select_student' || view === 'select_teacher' || view === 'dashboard') && (
                        <div className="mt-auto pt-10 pb-6 text-center text-slate-500 w-full bg-slate-100/50 border-t border-slate-200 relative group">
                            <div className="font-black text-lg mb-1 text-slate-600 uppercase tracking-widest">
                                Седмично разписание
                            </div>
                            <div className="font-bold text-xs tracking-widest uppercase opacity-80 mt-1 mb-2">
                                Учебна {initInfo.year} година • Срок {initInfo.term}
                            </div>
                            <div className="font-bold text-xs tracking-widest uppercase opacity-60 mt-2">
                                ЦСОП "Леда Милева" &copy; {new Date().getFullYear()} Всички права запазени.
                            </div>
                            <button onClick={() => setView('admin_login')} className="absolute bottom-4 right-4 p-2 text-slate-300 hover:text-slate-600 transition-colors opacity-0 group-hover:opacity-100" title="Администрация">
                                <Icons.Settings />
                            </button>
                        </div>
                    )}
                </div>
            );
        }

        function AdminPanel({ data, saveData, setSystemModal, showToast, initInfo, onExit }) {
            const [activeTab, setActiveTab] = useState('schedule'); 
            const [term, setTerm] = useState(initInfo.term); 
            const [schoolYear, setSchoolYear] = useState(initInfo.year);
            const [selectedClass, setSelectedClass] = useState('');
            
            const [curForm, setCurForm] = useState({ id: '', tId: '', sub: '', hours: 1 });
            const [editingItemId, setEditingItemId] = useState(null); 
            const [condForm, setCondForm] = useState({ tId: '', day: '0', hour: '1' });
            
            const [newTeacher, setNewTeacher] = useState('');
            const [newSubject, setNewSubject] = useState('');
            const [newClass, setNewClass] = useState('');

            const [manualEditModal, setManualEditModal] = useState({ isOpen: false, cls: '', day: 0, hour: 0, sub: '', tId: '' });
            const [editStringModal, setEditStringModal] = useState({ isOpen: false, type: '', id: '', oldVal: '', newVal: '' });
            const [assignSubModal, setAssignSubModal] = useState({ isOpen: false, subject: '', selectedClasses: [] });

            const dragClassItem = useRef();
            const dragClassOverItem = useRef();

            const currentYearData = data.yearlyData[schoolYear] || {};
            const currentClasses = currentYearData.classes || [];
            const currentTeachers = currentYearData.teachers || [];
            const currentSubjects = currentYearData.subjects || [];
            const currentConditions = currentYearData.conditions || [];
            const currentCurriculum = currentYearData.curriculum || { '1': {}, '2': {} };
            const currentSchedules = currentYearData.schedules || { '1': {}, '2': {} };

            useEffect(() => {
                setCurForm({ id: '', tId: '', sub: '', hours: 1 });
                setEditingItemId(null);
            }, [selectedClass, term, schoolYear]);

            const updateDataField = (field, value) => { saveData({ ...data, [field]: value }); };

            const updateYearlyDataField = (type, newYearData) => {
                const newYearlyData = JSON.parse(JSON.stringify(data.yearlyData || {}));
                if (!newYearlyData[schoolYear]) newYearlyData[schoolYear] = { classes: [], teachers: [], subjects: [], conditions: [], curriculum: { '1': {}, '2': {} }, schedules: { '1': {}, '2': {} } };
                newYearlyData[schoolYear][type] = newYearData;
                updateDataField('yearlyData', newYearlyData);
            };

            const updateMultipleYearlyFields = (updatesObj) => {
                const newYearlyData = JSON.parse(JSON.stringify(data.yearlyData || {}));
                if (!newYearlyData[schoolYear]) newYearlyData[schoolYear] = { classes: [], teachers: [], subjects: [], conditions: [], curriculum: { '1': {}, '2': {} }, schedules: { '1': {}, '2': {} } };
                Object.keys(updatesObj).forEach(key => { newYearlyData[schoolYear][key] = updatesObj[key]; });

            const handleExcelImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const fileData = new Uint8Array(evt.target.result);
                        const wb = XLSX.read(fileData, { type: 'array' });
                        const wsname = wb.SheetNames[0];
                        const ws = wb.Sheets[wsname];
                        const json = XLSX.utils.sheet_to_json(ws);

                        if(json.length === 0) {
                            e.target.value = null;
                            return setSystemModal({ isOpen: true, type: 'error', title: 'Грешка', message: 'Избраният файл е празен или няма данни в първия лист.' });
                        }

                        const getMatchingKey = (obj, keywords) => {
                            const keys = Object.keys(obj);
                            for (let key of keys) {
                                const lower = key.toLowerCase();
                                for (let kw of keywords) {
                                    if (lower.includes(kw)) return key;
                                }
                            }
                            return null;
                        };

                        let newClasses = [...currentClasses];
                        let newTeachers = JSON.parse(JSON.stringify(currentTeachers));
                        let newSubjects = [...currentSubjects];
                        let newCur = JSON.parse(JSON.stringify(currentCurriculum));

                        let importedCount = 0;

                        json.forEach((row, i) => {
                            const clsKey = getMatchingKey(row, ['клас', 'паралелка', 'class']);
                            const subKey = getMatchingKey(row, ['предмет', 'дисциплина', 'subject']);
                            const teacherKey = getMatchingKey(row, ['учител', 'преподавател', 'teacher']);
                            
                            const t1Key = getMatchingKey(row, ['i срок чс', '1 срок чс', 'чс i', 'чс 1', '1 чс']);
                            const t2Key = getMatchingKey(row, ['ii срок чс', '2 срок чс', 'чс ii', 'чс 2', '2 чс']);
                            const genKey = getMatchingKey(row, ['час', 'хорариум', 'брой', 'сезм', 'седмичен']);

                            if (!clsKey || !subKey) return; 

                            const clsName = String(row[clsKey]).trim();
                            const subName = String(row[subKey]).trim();
                            const teacherName = teacherKey && row[teacherKey] ? String(row[teacherKey]).trim() : '';
                            
                            let h1 = 0, h2 = 0;
                            if (t1Key || t2Key) {
                                if (t1Key) h1 = parseInt(row[t1Key], 10) || 0;
                                if (t2Key) h2 = parseInt(row[t2Key], 10) || 0;
                            } else {
                                const hoursRaw = genKey && row[genKey] ? parseInt(row[genKey], 10) : 1;
                                h1 = isNaN(hoursRaw) || hoursRaw <= 0 ? 1 : hoursRaw;
                                h2 = h1; 
                            }

                            if (!clsName || !subName) return;
                            if (h1 <= 0 && h2 <= 0) return; 

                            if (!newClasses.includes(clsName)) newClasses.push(clsName);
                            if (!newSubjects.includes(subName)) newSubjects.push(subName);

                            let tId = '';
                            if (teacherName) {
                                let existingTeacher = newTeachers.find(t => t.name.toLowerCase() === teacherName.toLowerCase());
                                if (existingTeacher) {
                                    tId = existingTeacher.id;
                                } else {
                                    tId = `t_imp_${Date.now()}_${i}`;
                                    newTeachers.push({ id: tId, name: teacherName });
                                }
                            }

                            if (h1 > 0) {
                                if (!newCur['1']) newCur['1'] = {};
                                if (!newCur['1'][clsName]) newCur['1'][clsName] = [];
                                let existingItem1 = newCur['1'][clsName].find(item => item.sub === subName);
                                if (existingItem1) {
                                    existingItem1.hours = h1;
                                    existingItem1.tId = tId;
                                } else {
                                    newCur['1'][clsName].push({ id: `c_imp_1_${Date.now()}_${i}`, tId: tId, sub: subName, hours: h1 });
                                }
                            }

                            if (h2 > 0) {
                                if (!newCur['2']) newCur['2'] = {};
                                if (!newCur['2'][clsName]) newCur['2'][clsName] = [];
                                let existingItem2 = newCur['2'][clsName].find(item => item.sub === subName);
                                if (existingItem2) {
                                    existingItem2.hours = h2;
                                    existingItem2.tId = tId;
                                } else {
                                    newCur['2'][clsName].push({ id: `c_imp_2_${Date.now()}_${i}`, tId: tId, sub: subName, hours: h2 });
                                }
                            }
                            importedCount++;
                        });

                        updateMultipleYearlyFields({ classes: newClasses, teachers: newTeachers, subjects: newSubjects, curriculum: newCur });
                        e.target.value = null; 
                        setSystemModal({ isOpen: true, type: 'info', title: 'Успешен импорт', message: `Успешно обработени ${importedCount} записа. Учебните планове са обновени автоматично.` });

                    } catch (err) {
                        e.target.value = null;
                        setSystemModal({ isOpen: true, type: 'error', title: 'Грешка', message: 'Възникна проблем при четенето на файла. Уверете се, че форматът е валиден Excel (.xlsx).' });
                    }
                };
                reader.readAsArrayBuffer(file);
            };

            const handleClearSchedule = () => {

                    message: `Сигурни ли сте, че искате да изчистите разписанието за Срок ${term}? Всички генерирани и ръчно въведени часове ще бъдат изтрити!`,

            const checkTeacherConflict = (tId, day, hour, skipCls) => {
                if (!tId) return { conflict: false };
                
                const currentScheds = currentSchedules[term] || {};
                for (let c in currentScheds) {
                    if (c !== skipCls) {
                        const slot = currentScheds[c][day]?.[hour];
                        if (slot && slot.tId === tId) {
                            return { conflict: true, type: 'hard', reason: `Този учител вече има час в ${c} клас по същото време!` };
                        }
                    }
                }

                const isBlocked = currentConditions.some(c => {
                    if (c.tId === tId && parseInt(c.day) === parseInt(day)) {
                        if (c.hour === 'all' || parseInt(c.hour) === parseInt(hour)) return true;
                    }
                    return false;
                });
                
                if (isBlocked) {
                    return { conflict: true, type: 'condition', reason: 'Има забрана в таб "Условия"' };
                }

                return { conflict: false };
            };

            const handleDragStartSchedule = (e, cls, day, hour) => {
                e.dataTransfer.setData('text/plain', JSON.stringify({ cls, day, hour }));
            };

            const handleDragOverSchedule = (e) => {
                e.preventDefault();
            };

            const handleDropSchedule = (e, targetCls, targetDay, targetHour) => {
                e.preventDefault();
                const rawData = e.dataTransfer.getData('text/plain');
                if (!rawData) return;
                
                try {
                    const source = JSON.parse(rawData);
                    if (source.cls !== targetCls) {
                        return setSystemModal({ isOpen: true, type: 'error', title: 'Невалидно преместване', message: 'Разместването е позволено само в рамките на една и съща паралелка!' });
                    }
                    if (source.day === targetDay && source.hour === targetHour) return;

                    const newSchedulesAll = JSON.parse(JSON.stringify(currentSchedules));
                    const clsSched = newSchedulesAll[term]?.[targetCls] || {};
                    
                    const sourceCell = clsSched[source.day]?.[source.hour];
                    const targetCell = clsSched[targetDay]?.[targetHour];

                    let conditionWarning = '';

                    if (sourceCell) {
                        const sConflict = checkTeacherConflict(sourceCell.tId, targetDay, targetHour, targetCls);
                        if (sConflict.type === 'hard') return setSystemModal({ isOpen: true, type: 'error', title: 'Застъпване!', message: sConflict.reason });
                        if (sConflict.type === 'condition') conditionWarning += `• За ${currentTeachers.find(t=>t.id===sourceCell.tId)?.name} (Нов час): ${sConflict.reason}\n`;
                    }

                    if (targetCell) {
                        const tConflict = checkTeacherConflict(targetCell.tId, source.day, source.hour, targetCls);
                        if (tConflict.type === 'hard') return setSystemModal({ isOpen: true, type: 'error', title: 'Застъпване при размяна!', message: tConflict.reason });
                        if (tConflict.type === 'condition') conditionWarning += `• За ${currentTeachers.find(t=>t.id===targetCell.tId)?.name} (Върнат час): ${tConflict.reason}\n`;
                    }

                    const executeSwap = () => {
                        if (!newSchedulesAll[term]) newSchedulesAll[term] = {};
                        if (!newSchedulesAll[term][targetCls]) newSchedulesAll[term][targetCls] = {};
                        if (!newSchedulesAll[term][targetCls][source.day]) newSchedulesAll[term][targetCls][source.day] = {};
                        if (!newSchedulesAll[term][targetCls][targetDay]) newSchedulesAll[term][targetCls][targetDay] = {};

                        newSchedulesAll[term][targetCls][targetDay][targetHour] = sourceCell;
                        newSchedulesAll[term][targetCls][source.day][source.hour] = targetCell;

                        if (!sourceCell) delete newSchedulesAll[term][targetCls][targetDay][targetHour];
                        if (!targetCell) delete newSchedulesAll[term][targetCls][source.day][source.hour];

                        updateMultipleYearlyFields({ schedules: newSchedulesAll });
                        showToast("Часовете са разместени успешно!");
                    };

                    if (conditionWarning) {
                        setSystemModal({
                            isOpen: true, type: 'confirm', title: 'Игнориране на Условия?',
                            message: `Има зададени ограничения:\n${conditionWarning}\nЖелаете ли да ги игнорирате и да запазите разместването?`,
                            onConfirm: executeSwap
                        });
                    } else {
                        executeSwap();
                    }

                } catch (err) { console.error("Drag and drop error:", err); }
            };

            const exportScheduleJSON = () => {
                const dataToExport = {

                    } catch (err) {

            const exportFullDatabaseJSON = () => {

                    message: `Сигурни ли сте, че искате да изтриете ВСИЧКИ класове, учители, предмети и разписания за ${schoolYear}? Това действие е необратимо!`,
                    onConfirm: () => {
